<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:;" />
  <script type="importmap">
    {
      "imports": {
        "jszip": "./jszip-esm-wrapper.min.js",
        "fflate": "../../node_modules/fflate/esm/browser.js"
      }
    }
  </script>
    <link rel="stylesheet" href="src/main.css">
  <script async type="text/javascript" src="app.min.js"></script>
  <title>EMS Media System</title>
</head>
<div class="window-container">
<body class="grid-container">
  <header class="headerbar">
    <div class="headerbar-start">
    </div>
    <div id="WindowTitle">EMS Media System</div>

    <div class="headerbar-end">
      <div class="headerbar-end__presentation">
      <button id="blackScreenButton" class="headerbar-action headerbar-action--black-screen" type="button" aria-label="Black screen (keeps media playing)" title="Black screen (keeps media playing)" aria-pressed="false" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="2.5" y="2.5" width="11" height="11" rx="1.5" fill="currentColor"/>
        </svg>
        <span id="blackScreenButtonLabel">Black</span>
      </button>
      <button id="logoHoldButton" class="headerbar-action headerbar-action--logo-hold" type="button" aria-label="Logo hold (keeps media playing)" title="Logo hold (keeps media playing)" aria-pressed="false" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="2" y="3" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="6" cy="7" r="1.25" fill="currentColor"/>
          <path d="M3 11l3-2.5 2 1.5 3.5-4 2.5 3" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="logoHoldButtonLabel">Logo</span>
      </button>
      <button id="clearLiveTextButton" class="headerbar-action headerbar-action--clear-text" type="button" aria-label="Clear live text and keep background" title="Clear live text and keep background" aria-pressed="false" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M4 4h8M8 4v8M6 12h4"/>
          <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M3.5 12.5l9-9"/>
        </svg>
        <span id="clearLiveTextButtonLabel">Clear Text</span>
      </button>
      </div>
      <div class="headerbar-end__chrome">
      <button id="headerAddMediaButton" class="headerbar-action" type="button" aria-label="Add media to schedule" title="Add media to schedule">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                d="M8 3.5v9M3.5 8h9"/>
        </svg>
        <span>Add Media</span>
      </button>
      <button id="mediaWindowPlayButton" type="button" data-playing="false">
        <svg class="mediaWindowPlayButton-icon mediaWindowPlayButton-icon--play" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4 3l9 5-9 5z" fill="currentColor"/>
        </svg>
        <svg class="mediaWindowPlayButton-icon mediaWindowPlayButton-icon--stop" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="4" y="4" width="8" height="8" rx="1" fill="currentColor"/>
        </svg>
        <span id="mediaWindowPlayButtonLabel">Present</span>
      </button>
      <button id="hamburgerMenuButton" class="hamburger-menu" aria-label="Menu">
        <svg width="16" height="16" viewBox="0 0 16 16">
          <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" 
                d="M2 5h12M2 8h12M2 11h12"/>
        </svg>
      </button>
      <ul id="gtkDropdownMenu" class="gtk-dropdown hidden">
        <li id="menuThemeManager" class="menu-item">Themes…</li>
        <li id="menuPreferences" class="menu-item">Preferences</li>
        <li class="menu-separator" role="separator"></li>
        <li id="menuOpenProject" class="menu-item">Open…</li>
        <li id="menuSaveProject" class="menu-item">Save Project</li>
        <li id="menuSaveProjectAs" class="menu-item">Save Project As…</li>
        <li id="menuExportProject" class="menu-item">Export Portable Project…</li>
        <li id="menuRelinkMissingFiles" class="menu-item">Relink Missing Files…</li>
        <li class="menu-item" onclick="invoke('open-help-window')">Help</li>
        <li id="aboutButton" class="menu-item" onclick="invoke('open-about-window')">About EMS</li>
      </ul>
      <div class="window-controls">
        <button class="window-control minimize" tabindex="-1" aria-label="Minimize">
          <svg width="16" height="16" viewBox="0 0 16 16">
            <rect x="4" y="7" width="8" height="2" fill="currentColor" />
          </svg>
        </button>
        <button class="window-control maximize" tabindex="-1" aria-label="Maximize">
          <svg width="16" height="16" viewBox="0 0 16 16" class="maximize-icon">
            <rect x="4" y="4" width="8" height="8" stroke="currentColor" fill="none" stroke-width="1" />
          </svg>
          <svg width="16" height="16" viewBox="0 0 16 16" class="restore-icon" style="display: none;">
            <g fill="none" stroke="currentColor" stroke-width="1">
              <rect x="4" y="6" width="6" height="6" />
              <path d="M6 4h6v6" />
            </g>
          </svg>
        </button>
        <button class="window-control close" tabindex="-1" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 16 16">
            <path d="M5 5l6 6m0-6l-6 6" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>
      </div>
      </div>
    </div>
  </header>
  <main>
    <nav id="globalNavigation" class="global-navigation" aria-label="Primary navigation">
      <button id="openMediaWorkspaceBtn" class="global-navigation__item" type="button" title="Media and schedule">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v11H4zM9 19h6M12 16.5V19"/></svg><span>Media</span>
      </button>
      <button id="openSongsWorkspaceBtn" class="global-navigation__item" type="button" title="Songs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V6l9-2v11M9 9l9-2M6.5 20A2.5 2.5 0 1 0 6.5 15a2.5 2.5 0 0 0 0 5Zm9-2A2.5 2.5 0 1 0 15.5 13a2.5 2.5 0 0 0 0 5Z"/></svg><span>Songs</span>
      </button>
      <button id="openBibleWorkspaceBtn" class="global-navigation__item" type="button" title="Bible">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Zm0 12h11M9 8h6"/></svg><span>Bible</span>
      </button>
      <button id="openSlidesWorkspaceBtn" class="global-navigation__item" type="button" title="Slides">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5h17v12h-17zM9 20h6M12 17v3"/></svg><span>Slides</span>
      </button>
      <span class="global-navigation__spacer"></span>
      <button id="openStageControlsBtn" class="global-navigation__item" type="button" title="Stage output and private messages">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v12H4zM8 21h8M12 17v4M8 10h8M8 13h5"/></svg><span>Stage</span><span id="stageNavStatus" class="global-navigation__status" aria-label="Stage output closed"></span>
      </button>
    </nav>
    <!-- Persistent media shell: presentation elements stay mounted while the
         schedule UI refreshes, so live playback is not interrupted. -->
    <div id="dyneForm">
      <div id="tab-panel-media" class="tab-panel tab-panel--media"></div>
    </div>
    <div id="stageControlsBackdrop" class="stage-controls-backdrop" hidden>
      <section id="stageControls" class="stage-controls" role="dialog" aria-modal="true" aria-labelledby="stageControlsTitle">
        <header class="stage-controls__header"><div><h2 id="stageControlsTitle">Stage Output</h2><p id="stageOutputStatus" aria-live="polite">Stage output closed</p></div><button id="closeStageControlsBtn" class="stage-controls__close" type="button" aria-label="Close stage controls">×</button></header>
        <div class="stage-controls__body">
          <div class="stage-controls__row"><label for="stageDisplaySelect">Stage display</label><select id="stageDisplaySelect"><option value="">No Stage Output</option></select></div>
          <div class="stage-controls__row"><label for="stageProfileSelect">Layout</label><select id="stageProfileSelect"><option value="current-next">Current + Next</option><option value="current-only">Current Only</option><option value="notes">Notes</option><option value="clock">Clock</option></select></div>
          <div class="stage-message-card"><label for="stageMessageText">Private message</label><textarea id="stageMessageText" rows="4" maxlength="500" placeholder="Message visible only on the stage display"></textarea><p>Private messages are never sent to the audience output.</p><div class="stage-message-card__actions"><button id="clearStageMessageBtn" type="button" title="Clear private stage message (Ctrl+Shift+F8)">Clear</button><button id="showStageMessageBtn" class="suggested-action" type="button" title="Show private stage message (Ctrl+F8)">Show on Stage</button></div></div>
        </div>
      </section>
    </div>
  </main>
  </div>
</body>
</html>
