        .scripture-render__body {
            color: var(--scripture-color);

        .scripture-render--lower-third .scripture-render__attribution {
            position: relative;
            z-index: 1;
        }

        .scripture-render--lower-third .scripture-render__body {
            font-size: var(--scripture-lower-third-font-size);
            line-height: var(--lower-third-body-line-height);
            text-shadow: none;
            max-height: calc(var(--lower-third-body-line-height) * 2);
            min-height: calc(var(--lower-third-body-line-height) * 2);
            overflow: hidden;
        }

        .scripture-render--lower-third .scripture-render__reference {
            font-size: clamp(14px, calc(var(--scripture-lower-third-font-size) * 0.4), 20px);
            margin-top: var(--lower-third-reference-margin);
            text-shadow: none;
        }

        .scripture-render--lower-third .scripture-render__attribution {
            font-size: clamp(12px, calc(var(--scripture-lower-third-font-size) * 0.24), 18px);
            margin-top: var(--lower-third-attribution-margin);
            text-shadow: none;
        }

        /*
         * Chroma output is deliberately filtered as a transparent foreground
         * layer. The SVG filter steepens (but does not binarize) glyph alpha,
         * grows the original mask by roughly one physical pixel, and fills the
         * resulting boundary with neutral charcoal before Chromium composites
         * the layer over the key color.
         */
        .chroma-edge-optimized.chroma-edge-no-plate.scripture-render--lower-third .scripture-render__body,
        .chroma-edge-optimized.chroma-edge-no-plate.scripture-render--lower-third .scripture-render__reference,
        .chroma-edge-optimized.chroma-edge-no-plate.scripture-render--lower-third .scripture-render__attribution,
        .chroma-edge-optimized.chroma-edge-opaque-plate.scripture-render--lower-third .scripture-render__box {
            filter: url(#ems-chroma-text-edge);
            isolation: isolate;
            -webkit-font-smoothing: antialiased;
            text-rendering: geometricPrecision;
        }

        .ems-slide-transition {
            animation-duration: var(--ems-slide-transition-duration, 350ms);
            animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
            animation-fill-mode: both;
            will-change: opacity, transform;
        }

        .ems-slide-transition--fade {
            animation-name: ems-slide-transition-fade;
        }

        .ems-slide-transition--slide-left {
            animation-name: ems-slide-transition-left;
        }

        .ems-slide-transition--slide-right {
            animation-name: ems-slide-transition-right;
        }

        .ems-slide-transition--zoom {
            animation-name: ems-slide-transition-zoom;
        }

        @keyframes ems-slide-transition-fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes ems-slide-transition-left {
            from { opacity: 0; transform: translateX(3.5vw); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes ems-slide-transition-right {
            from { opacity: 0; transform: translateX(-3.5vw); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes ems-slide-transition-zoom {
            from { opacity: 0; transform: scale(0.965); }
            to { opacity: 1; transform: scale(1); }
        }

<body>
    <div id="liveBackgroundLayer" hidden aria-hidden="true">
        <img id="liveBackgroundImage" hidden alt="" />
        <video id="liveBackgroundVideo" hidden muted loop playsinline></video>
    </div>
    <svg width="0" height="0" aria-hidden="true" focusable="false"
         style="position:absolute;overflow:hidden;pointer-events:none">
        <defs>
            <filter id="ems-chroma-text-edge" x="-5%" y="-15%" width="110%" height="130%"
                    color-interpolation-filters="sRGB">
                <!-- 0,15,50,105,180,235,255 -> 0,0,25,100,220,255,255 -->
                <feComponentTransfer in="SourceGraphic" result="hardened-text">
                    <feFuncA type="table" tableValues="0 0 .042 .084 .152 .232 .312 .392 .486 .580 .675 .769 .863 .900 .938 .975 1 1"/>
                </feComponentTransfer>
                <feMorphology in="SourceAlpha" operator="dilate" radius="0.75" result="expanded-alpha"/>
                <feComposite in="expanded-alpha" in2="SourceAlpha" operator="out" result="outline-alpha"/>
                <feFlood flood-color="#101010" flood-opacity="0.95" result="outline-color"/>
                <feComposite in="outline-color" in2="outline-alpha" operator="in" result="neutral-outline"/>
                <feMerge>
                    <feMergeNode in="neutral-outline"/>
                    <feMergeNode in="hardened-text"/>
                </feMerge>
            </filter>
        </defs>
    </svg>
    <video id="bigPlayer"></video>
    <div id="streamStatusOverlay" hidden>
        <div class="stream-status-spinner" aria-hidden="true"></div>
        <svg class="stream-status-error-symbol" viewBox="0 0 96 96" aria-hidden="true">
            <circle cx="48" cy="48" r="34" fill="none" stroke="currentColor" stroke-width="6" />
            <path d="M34 34l28 28M62 34L34 62" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
        </svg>
        <div id="streamStatusTitle" class="stream-status-title"></div>
        <div id="streamStatusDetail" class="stream-status-detail"></div>
